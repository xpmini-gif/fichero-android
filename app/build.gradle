def ficheroSigningStore = System.getenv("FICHERO_SIGNING_STORE_FILE")
def ficheroSigningPassword = System.getenv("FICHERO_SIGNING_PASSWORD")

plugins {
    id "com.android.application"
}

android {
    namespace "com.xpmini.fichero"
    compileSdk 35

    defaultConfig {
        applicationId "com.xpmini.fichero"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "0.1.3"
    }

    if (ficheroSigningStore && ficheroSigningPassword) {
        signingConfigs {
            release {
                storeFile file(ficheroSigningStore)
                storePassword ficheroSigningPassword
                keyAlias "fichero"
                keyPassword ficheroSigningPassword
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ficheroSigningStore && ficheroSigningPassword) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}


dependencies {
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.webkit:webkit:1.12.1"
}
