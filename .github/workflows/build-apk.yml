name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Android wrapper
        uses: actions/checkout@v4
        with:
          path: android

      - name: Checkout upstream Fichero
        uses: actions/checkout@v4
        with:
          repository: casper-aurai/fichero-printer
          ref: c7e060f111ae830e3db2fde403170ef3df3b7ddb
          path: upstream

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: upstream/web/package-lock.json

      - name: Patch upstream for Android
        working-directory: android
        run: python3 scripts/patch_upstream.py

      - name: Build bundled web editor
        working-directory: upstream/web
        run: |
          npm ci
          npm run check
          npm run build

      - name: Copy web bundle into APK assets
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -a upstream/web/dist/. android/app/src/main/assets/web/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure stable release signing when secrets exist
        env:
          FICHERO_SIGNING_KEY_B64: ${{ secrets.FICHERO_SIGNING_KEY_B64 }}
          FICHERO_SIGNING_PASSWORD: ${{ secrets.FICHERO_SIGNING_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$FICHERO_SIGNING_KEY_B64" ] && [ -n "$FICHERO_SIGNING_PASSWORD" ]; then
            printf '%s' "$FICHERO_SIGNING_KEY_B64" | base64 --decode > "$GITHUB_WORKSPACE/android/fichero-release.p12"
            echo "FICHERO_SIGNING_STORE_FILE=$GITHUB_WORKSPACE/android/fichero-release.p12" >> "$GITHUB_ENV"
            echo "FICHERO_SIGNING_PASSWORD=$FICHERO_SIGNING_PASSWORD" >> "$GITHUB_ENV"
            echo "Stable release signing enabled"
          else
            echo "Signing secrets not configured; release APK will be unsigned"
          fi

      - name: Build APKs
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Verify APK has no INTERNET permission
        run: |
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          if grep -q "android.permission.INTERNET" /tmp/permissions.txt; then
            echo "INTERNET permission unexpectedly present"
            exit 1
          fi

      - name: Collect APKs
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Fichero-Offline-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk Fichero-Offline-release.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk Fichero-Offline-release-unsigned.apk
          fi

      - name: Bundle apksigner tool
        shell: bash
        run: |
          mkdir -p apksigner-tool/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" apksigner-tool/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner-tool/lib/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Fichero-Offline-APKs
          path: |
            Fichero-Offline-debug.apk
            Fichero-Offline-release-unsigned.apk
            Fichero-Offline-release.apk
            apksigner-tool/
          if-no-files-found: warn
